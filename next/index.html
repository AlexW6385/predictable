<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E7ECF1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Predictable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: the page is the game. Everything fits the viewport and nothing scrolls; the 16:9 canvas is fitted (contain) into whatever room is left. No words in the game itself. */
:root{
  --paper:#E7ECF1; --grid:#D3DCE4; --ink:#1E2B47; --ink-soft:#4A5878; --pencil:#CF3E32; --gold:#E2A62A;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink)}
body{
  position:fixed;inset:0;
  font-family:var(--f-mono);font-size:13px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.2vw,34px);line-height:1;margin:0;letter-spacing:.02em;width:min(100%,var(--cw,100%));align-self:center}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}
.view{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;outline:none;border:2.5px solid var(--ink);background:var(--paper);box-shadow:6px 6px 0 var(--ink)}
.side{display:none;flex-direction:column;justify-content:space-between;align-items:center;flex:none}
.side .grp{display:flex;gap:8px}
.side [data-k]{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none;padding:0}
.side [data-k]:active{background:var(--gold)}
.dpad{display:flex;width:116px;height:54px;border:2.5px solid var(--ink);border-radius:27px;background:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.dpad .h{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:var(--f-display);font-size:18px;pointer-events:none}
.dpad .h.l{border-right:1.5px solid var(--grid)}
.dpad.left .h.l,.dpad.right .h.r{background:var(--gold)}
.mini{touch-action:manipulation;width:38px;height:32px;border:2px solid var(--ink-soft);border-radius:6px;background:var(--paper);color:var(--ink);font-size:16px;line-height:1;padding:0;cursor:pointer}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;color:var(--ink-soft);width:min(100%,var(--cw,100%));align-self:center}
.foot .tools{display:flex;gap:8px}
.keys{display:flex;gap:6px;align-items:center}
.keys kbd{font-family:var(--f-mono);font-size:14px;border:1.5px solid var(--ink-soft);border-bottom-width:3px;border-radius:4px;padding:1px 7px;color:var(--ink);background:var(--paper)}
.keys .sep{width:10px}
.btn{font-family:var(--f-mono);font-size:16px;line-height:1;border:1.5px solid var(--ink-soft);color:var(--ink);background:var(--paper);padding:6px 10px;cursor:pointer}
@media (hover:hover){.btn:hover,.mini:hover{background:var(--ink);color:var(--paper)}}
/* level picker: a 10x10 sheet of numbers over the game; only levels you have reached can be opened */
.picker{position:absolute;z-index:4;display:none;flex-direction:column;gap:6px;padding:10px;background:rgba(231,236,241,.96);border:2.5px solid var(--ink);box-sizing:border-box}
.picker.open{display:flex}
.picker .top{display:flex;justify-content:space-between;align-items:center}
.picker .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:4px}
.picker .grid button{font-family:var(--f-mono);font-size:clamp(9px,1.6vmin,15px);border:1.5px solid var(--ink-soft);background:var(--paper);color:var(--ink);padding:0;cursor:pointer;min-height:0}
.picker .grid button.done{background:#F2DDAA;border-color:var(--gold)}
.picker .grid button.cur{outline:2.5px solid var(--ink);outline-offset:-1px;font-weight:700}
.picker .grid button:not(:disabled):active{background:var(--ink);color:var(--paper)}
.rot{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:var(--paper);z-index:5;pointer-events:none}
.rot svg{width:96px;height:96px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
/* touch devices: the game takes the whole screen; the controls get their own strips beside it, so they never cover it */
@media (pointer:coarse){
  .wrap{gap:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  h1,.foot{display:none}
  canvas{border:0;box-shadow:none}
  .side{display:flex;padding:8px 7px max(10px,env(safe-area-inset-bottom,0px))}
  .mini{width:52px;height:44px;font-size:20px;border-width:2.5px;border-color:var(--ink)}
  .mini.hit{background:var(--gold)}
}
  .stage.below .side{position:absolute;top:0;bottom:0;z-index:2}
  .stage.below .side.l{left:0;align-items:flex-start} .stage.below .side.r{right:0;align-items:flex-end}
  .stage.below .view{align-items:flex-start}
@media (pointer:coarse) and (orientation:portrait){.rot{display:flex}}
.btn:focus-visible,.mini:focus-visible,.side [data-k]:focus-visible,.picker button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="wrap">
  <h1>PREDICTABLE</h1>
  <div class="stage" id="stage">
    <div class="side l" id="sideL">
      <button class="mini" data-act="restart" aria-label="Restart this level" title="Restart this level">↺</button>
      <div class="dpad" id="dpad" role="group" aria-label="Move: press and slide left or right"><span class="h l">◀</span><span class="h r">▶</span></div>
    </div>
    <div class="view" id="view">
      <canvas id="c" tabindex="0" aria-label="Predictable game"></canvas>
      <div class="picker" id="picker" role="dialog" aria-label="Levels">
        <div class="top"><span></span><button class="mini" data-act="levels" aria-label="Close" title="Close">✕</button></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="side r" id="sideR">
      <button class="mini" data-act="levels" aria-label="Levels" title="Levels">▦</button>
      <div class="grp"><button data-k="jump" aria-label="Jump">▲</button></div>
    </div>
  </div>
  <div class="foot">
    <span class="keys" aria-label="Arrow keys move, up or space jumps, R restarts the level"><kbd>←</kbd><kbd>→</kbd><span class="sep"></span><kbd>↑</kbd><kbd>␣</kbd><span class="sep"></span><kbd>R</kbd></span>
    <span class="tools"><button class="btn" data-act="levels" aria-label="Levels" title="Levels">▦</button><button class="btn" data-act="restart" aria-label="Restart this level" title="Restart this level">↺</button></span>
  </div>
</div>
<div class="rot" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke="#1E2B47" stroke-width="4" stroke-linejoin="round"><rect x="30" y="12" width="36" height="72" rx="6"/><circle cx="48" cy="74" r="3" fill="#1E2B47"/><path d="M80 40a34 34 0 0 1-8 26" stroke="#E2A62A"/><path d="M66 62l6 5 6-7" stroke="#E2A62A"/></svg></div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, T = 32, GY = 448, PW = 22, PH = 28;
const C = { paper:'#E7ECF1', grid:'#D3DCE4', grid2:'#BFCBD6', ink:'#1E2B47', ink2:'#33426A', soft:'#4A5878', red:'#CF3E32', gold:'#E2A62A', white:'#FBFCFD', door:'#8B5A3C', night:'rgba(16,22,40,0.965)' };
const FD = '"Bungee","Arial Black",sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => a && a.length ? a.reduce((s,v)=>s+v,0)/a.length : null;
const push = (a,v,n=6) => { a.push(v); if (a.length > n) a.shift(); };
// guesses your next choice: you repeat yourself, unless you have been alternating
const predict = (h, def, a, b) => { if (!h || !h.length) return def; const l = h[h.length-1]; if (h.length >= 2 && h[h.length-2] !== l) return l === a ? b : a; return l; };

/* ================= memory ================= */
// levels are kept by name, not by position, so progress survives any reordering; nothing here is ever reset
const KEY = 'predictable.v6';
const fresh = () => ({ level:null, done:{}, deaths:0, wins:0, marks:{}, retry:[], spd:null, eyeLR:[], mem:null, v5:null });
let prof = fresh();
try { const s = localStorage.getItem(KEY); if (s) prof = Object.assign(fresh(), JSON.parse(s)); } catch(e) {}
const markDone = () => { prof.done[lv.id] = 1; save(); };
const marksOf = () => prof.marks[lv.id] || (prof.marks[lv.id] = []);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prof)); } catch(e) {} };

/* ================= input ================= */
const keys = {left:false, right:false, jump:false}; let jumpEdge = false, pressEdge = false;
const KM = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump'};
addEventListener('keydown', e => { const k = KM[e.code]; if (k) { e.preventDefault(); if (!keys[k]) pressEdge = true; if (k==='jump' && !keys.jump) jumpEdge = true; keys[k] = true; } if (e.code === 'Enter') jumpEdge = true; });
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
document.querySelectorAll('.side [data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} if (!keys[k]) pressEdge = true; if (k==='jump' && !keys.jump) jumpEdge = true; keys[k] = true; });
  const up = () => { keys[k] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
// the move pad is one strip: press anywhere on it and slide; which half of it your finger is over is the direction you go
{ const dp = document.getElementById('dpad'); let pid = null;
  const set = d => { if (d === (keys.left ? 'left' : keys.right ? 'right' : null)) return; if (d) pressEdge = true; keys.left = d === 'left'; keys.right = d === 'right'; dp.classList.toggle('left', d === 'left'); dp.classList.toggle('right', d === 'right'); };
  const at = e => { const r = dp.getBoundingClientRect(), dx = e.clientX - (r.left + r.width/2); return Math.abs(dx) < 4 ? (keys.left ? 'left' : keys.right ? 'right' : dx < 0 ? 'left' : 'right') : dx < 0 ? 'left' : 'right'; };
  dp.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; try { dp.setPointerCapture(pid); } catch(_){} set(at(e)); });
  dp.addEventListener('pointermove', e => { if (e.pointerId === pid) set(at(e)); });
  const end = e => { if (e.pointerId !== pid) return; pid = null; set(null); };
  dp.addEventListener('pointerup', end); dp.addEventListener('pointercancel', end); dp.addEventListener('lostpointercapture', end); }
cv.addEventListener('pointerdown', () => { cv.focus(); if (state !== 'play' || (S && S.over)) jumpEdge = true; });
// restart the level you are on (fresh level memory, no death counted); the level sheet jumps to any level you have reached
function restartLevel(){ if (state === 'title') return; prof.mem = null; startLevel(lvl); state = 'play'; parts = []; flash = 0; shake = 0; }
const picker = document.getElementById('picker'), grid = document.getElementById('grid');
function placePicker(){ const r = cv.getBoundingClientRect(), v = document.getElementById('view').getBoundingClientRect(); Object.assign(picker.style, {left:(r.left - v.left) + 'px', top:(r.top - v.top) + 'px', width:r.width + 'px', height:r.height + 'px'}); }
function buildGrid(){ grid.textContent = '';
  for (let i = 0; i < LV.length; i++) { const b = document.createElement('button'); b.textContent = String(i + 1).padStart(2, '0'); b.className = (prof.done[LV[i].id] ? 'done' : '') + (i === lvl ? ' cur' : '');
    b.addEventListener('click', () => { closePicker(); prof.mem = null; startLevel(i); state = 'play'; parts = []; }); grid.appendChild(b); } }
function openPicker(){ buildGrid(); placePicker(); picker.classList.add('open'); paused = true; }
function closePicker(){ picker.classList.remove('open'); paused = false; keys.left = keys.right = keys.jump = false; cv.focus(); }
const togglePicker = () => picker.classList.contains('open') ? closePicker() : openPicker();
// these act the moment a finger or mouse goes down (a tap that drifts a little, or a page that is busy switching to full screen, can lose a click);
// the click handler is only for keyboard activation
const act = b => { if (b.dataset.act === 'restart') { if (picker.classList.contains('open')) closePicker(); restartLevel(); cv.focus(); } else togglePicker(); };
document.querySelectorAll('[data-act]').forEach(b => {
  b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); e.stopPropagation(); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 160); act(b); });
  b.addEventListener('click', e => { if (e.detail === 0) act(b); });
});
addEventListener('keydown', e => { if (e.code === 'KeyR' && !picker.classList.contains('open')) restartLevel(); else if (e.code === 'Escape' && picker.classList.contains('open')) closePicker(); });

/* ================= world ================= */
let lvl = 0, lv = null, S = null, M = null, ents = [], P = null, state = 'title', deathT = 0, clearT = 0, frame = 0, camX = 0, parts = [], shake = 0, flash = 0, paused = false;
const lvW = () => (lv.w || 30) * T;
const SOLID = new Set(['g','b','bb','tog','plank','crate','box','pt','mb','raft','q','th','vine','belt','cloud','body']);
const E = o => { const e = Object.assign({alive:true, fall:0, vy:0}, o); ents.push(e); return e; };
const R = (t, c0, c1, r0, r1, o) => E(Object.assign({t, x:c0*T, y:r0*T, w:(c1-c0+1)*T, h:(r1-r0+1)*T, solid:SOLID.has(t)}, o||{}));
const Gd = (c0, c1, o) => R('g', c0, c1, 14, 16, o);
const Gt = (c0, c1, o) => { const a = []; for (let c = c0; c <= c1; c++) a.push(R('g', c, c, 14, 16, Object.assign({ti:c}, o||{}))); return a; };
const Sp = (c0, c1, r, dir, o) => E(Object.assign({t:'s', x:c0*T, y: dir === 'up' ? r*T + 16 : r*T, w:(c1-c0+1)*T, h:16, dir, kill:true}, o||{}));
const HS = c => E({t:'s', x:c*T, y:13*T + 16, w:T, h:16, dir:'up', kill:true, inv:true});
const Door = (c, rb, o) => E(Object.assign({t:'door', x:c*T - 2, y:rb*T - 56, w:36, h:56}, o||{}));
const isSolid = e => e.alive && e.solid && !e.fall && !e.ghost && (!e.cond || e.cond(e));
const ov = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
const pbox = (i=0) => ({x:P.x+i, y:P.y+i, w:PW-2*i, h:PH-2*i});
const pcx = () => P.x + PW/2;
const groundAt = (x, y) => ents.some(e => isSolid(e) && x >= e.x && x <= e.x + e.w && y >= e.y - 2 && y <= e.y + 4);
const reveal = o => { o.inv = false; o.revealT = 30; };
const still = () => P.on && Math.abs(P.vx) < 0.3;
// really running: near full speed for a while (a quick tap never counts, so players who tap their way along are 'walking')
const running = () => (P.runT || 0) > 9;

/* ---------- shared pieces ---------- */
function cone(x, o){ (S.cones || (S.cones = [])).push(Object.assign({x, y:-40, st:'fall', floor:GY}, o||{})); }
function updCones(){
  for (const c of (S.cones || [])) {
    if (c.st === 'stake') { if (--c.t <= 0) c.st = 'done'; else if (ov(pbox(3), {x:c.x - 9, y:GY - 40, w:18, h:40})) { die('cone'); return true; } continue; }
    if (c.st !== 'fall') continue;
    c.y += 26;
    const r = {x:c.x-11, y:c.y, w:22, h:40};
    if (c.block && ents.some(e => e.roof && !e.fakeRoof && isSolid(e) && ov(r, e))) { c.st = 'done'; dust(c.x, c.y + 40); continue; }
    if (c.hitAlso && c.hitAlso(r)) { c.st = 'done'; continue; }
    if (ov(pbox(3), r)) { die('cone'); return true; }
    if (!c.grounded && c.y + 40 >= GY) { c.grounded = true; c.onGround && c.onGround(c); }
    if (c.y + 40 >= c.floor) { c.st = c.stake && c.floor <= GY ? 'stake' : 'done'; c.t = c.stake || 0; if (c.st === 'stake') c.y = GY - 40; if (c.floor <= GY) { dust(c.x, GY); shake = Math.max(shake, 3); } }
  }
}
function drawCones(){
  for (const c of (S.cones || [])) {
    if (c.st === 'stake') { ctx.globalAlpha = Math.min(1, c.t/10); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(c.x - 13, c.y); ctx.lineTo(c.x + 13, c.y); ctx.lineTo(c.x, c.y + 40); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; continue; }
    if (c.st !== 'fall') continue;
    const a = clamp((c.y + 40) / GY, 0, 1);
    ctx.fillStyle = `rgba(30,43,71,${0.4*a})`; ctx.beginPath(); ctx.ellipse(c.x, GY - 1, 5 + 11*a, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(c.x - 13, c.y); ctx.lineTo(c.x + 13, c.y); ctx.lineTo(c.x, c.y + 40); ctx.closePath(); ctx.fill();
  }
}
function pushBox(b, dx){
  const nx = b.x + dx, test = {x:nx, y:b.y, w:b.w, h:b.h - 1};
  if (nx < 0 || nx + b.w > lvW()) return;
  for (const o of ents) if (o !== b && isSolid(o) && ov(test, o)) return;
  b.x = nx;
}
// a flag with eyes; it watches you
function drawEyeFlag(x, baseY, happy){
  const fx = x + 4, fy = baseY;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy-84); ctx.stroke();
  const wave = Math.sin(frame*0.12)*3;
  ctx.fillStyle = C.gold; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(fx+2, fy-84); ctx.lineTo(fx+44, fy-80+wave); ctx.lineTo(fx+44, fy-54+wave); ctx.lineTo(fx+2, fy-58); ctx.closePath(); ctx.fill(); ctx.stroke();
  const dx = pcx() - (fx+22), dy = (P.y + PH) - (fy-68), d = Math.hypot(dx,dy) || 1;
  for (const ex of [fx+16, fx+31]) {
    ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ex, fy-69+wave/2, 6, 0, 7); ctx.fill(); ctx.stroke();
    if (happy) { ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, fy-71+wave/2, 3, 0.2, Math.PI-0.2); ctx.stroke(); }
    else { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(ex + dx/d*3, fy-69+wave/2 + dy/d*3, 2.6, 0, 7); ctx.fill(); }
  }
}
// the Eye
function drawEye(cx, cy, r, lx, ly, lid){
  ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - r*1.6, cy); ctx.quadraticCurveTo(cx, cy - r*1.25, cx + r*1.6, cy); ctx.quadraticCurveTo(cx, cy + r*1.25, cx - r*1.6, cy); ctx.closePath(); ctx.fill(); ctx.stroke();
  const dx = lx - cx, dy = ly - cy, d = Math.hypot(dx, dy) || 1, m = Math.min(r*0.55, d*0.08);
  ctx.save(); ctx.beginPath(); ctx.moveTo(cx - r*1.6, cy); ctx.quadraticCurveTo(cx, cy - r*1.25, cx + r*1.6, cy); ctx.quadraticCurveTo(cx, cy + r*1.25, cx - r*1.6, cy); ctx.clip();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx + dx/d*m, cy + dy/d*m, r*0.48, 0, 7); ctx.fill();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(cx + dx/d*m, cy + dy/d*m, r*0.16, 0, 7); ctx.fill();
  if (lid > 0) { ctx.fillStyle = C.ink2; ctx.fillRect(cx - r*1.7, cy - r*1.3, r*3.4, r*1.3*2*lid); }
  ctx.restore();
  if (lid > 0.95) { ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - r*1.6, cy); ctx.quadraticCurveTo(cx, cy + r*0.5, cx + r*1.6, cy); ctx.stroke(); }
}
// the door that runs away from whoever wants it, and walks to whoever lets go.
// o: min/max (where it may go), noFlee (it stands its ground when chased), noFollow (it doesn't trail after you when you leave)
function fleeDoor(d, approach, o){
